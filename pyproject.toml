[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geonexus-sdk"
version = "1.1.1.dev20261015"
description = "GeoNexus - federated geospatial intelligence: GeoCard, GeoMCP, GeoNode, GeoSkill"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "GeoNexus Project" }]
keywords = ["geospatial", "geocard", "geomcp", "geonode", "federated", "gis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "pydantic>=2.5",
    "jsonschema>=4.20",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://geonexus.org"
Documentation = "https://geonexus.org/docs"
Source = "https://github.com/geonexus/geonexus"
Changelog = "https://github.com/geonexus/geonexus/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.24,<2",
    # Pinned: the formatter's output is version-dependent, and an unpinned
    # range silently re-formats the whole repo on a new release.
    "ruff==0.16.7",
    "pre-commit>=3.7",
    "mypy>=1.10",
    "types-jsonschema",
    "types-PyYAML",
    "build>=1.2",
    "coverage>=7.4",
]
mcp = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
]
http = ["httpx>=0.28,<1"]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "httpx>=0.28,<1", "PyJWT>=2.8", "cryptography>=42.0"]
geo = ["numpy>=1.24", "rasterio>=1.3", "shapely>=2.0", "pyproj>=3.5"]
all = [
    "mcp>=2.3,<3", "httpx>=0.28,<1", "fastapi>=0.110,<1", "uvicorn>=0.27,<1",
    "PyJWT>=2.8", "cryptography>=42.0", "numpy>=1.24", "rasterio>=1.3",
    "shapely>=2.0", "pyproj>=3.5",
]

[project.scripts]
geonexus = "geonexus.cli:main"
georegister = "geonexus.registration:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geonexus = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
exclude = [".venv", "output", "build", "dist"]

[tool.ruff.format]
# 不格式化 Markdown 里的 Python 示例代码。ruff 会把 ```python 代码块当源码处理，
# 于是文档里**有意对齐的注释列**会被压成两个空格——那是排版，不是代码风格问题：
#
#     task_id: str                    # 全局唯一，同时是幂等键
#     kind: TaskKind                  # skill | model | batch | composite
#
# 示例片段的正确性由 tests/test_docs_consistency.py（名字/路径存在性）与文档评审保证，
# 不由格式化器保证。
exclude = ["docs", "**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "B008"]  # B008: FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# web/auth.py — BearerAuth/APIKeyAuth are consumed as *class-instance* FastAPI
# dependencies. FastAPI resolves their `__call__` signature via
# `getattr(instance, "__globals__", {})`, which is empty for instances, so a
# string annotation like "Request" cannot be resolved on Python < 3.10 and the
# whole app fails to build. The module therefore must NOT use
# `from __future__ import annotations`, which in turn forbids PEP 604 unions —
# hence UP045 must stay off for this file only.
"src/geonexus/web/auth.py" = ["UP045"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["examples/"]

[[tool.mypy.overrides]]
# 第三方可选依赖：运行时有 try/except 或 extras 保护，这里不要求类型存根。
# 未列出的模块仍会报错，避免把"没装 stub"和"代码真有问题"混为一谈。
module = [
    "rasterio", "rasterio.*",
    "yaml",
    "jsonschema", "jsonschema.*",
    "psycopg2", "psycopg2.*",
    "fiona",
    "neo4j", "neo4j.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["geonexus"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
