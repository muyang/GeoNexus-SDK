[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geonexus-sdk"
version = "1.0.0"
description = "GeoNexus - federated geospatial intelligence: GeoCard, GeoMCP, GeoNode, GeoSkill"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "GeoNexus Project" }]
keywords = ["geospatial", "geocard", "geomcp", "geonode", "federated", "gis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "pydantic>=2.5",
    "jsonschema>=4.20",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "PyJWT>=2.8",
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://geonexus.org"
Documentation = "https://geonexus.org/docs"
Source = "https://github.com/geonexus/geonexus"
Changelog = "https://github.com/geonexus/geonexus/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "coverage>=7.4",
]
mcp = [
    "mcp>=1.2",
]

[project.scripts]
geonexus = "geonexus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geonexus = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
exclude = [".venv", "output", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "B008"]  # B008: FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# web/auth.py — BearerAuth/APIKeyAuth are consumed as *class-instance* FastAPI
# dependencies. FastAPI resolves their `__call__` signature via
# `getattr(instance, "__globals__", {})`, which is empty for instances, so a
# string annotation like "Request" cannot be resolved on Python < 3.10 and the
# whole app fails to build. The module therefore must NOT use
# `from __future__ import annotations`, which in turn forbids PEP 604 unions —
# hence UP045 must stay off for this file only.
"src/geonexus/web/auth.py" = ["UP045"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["examples/"]

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["geonexus"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
